<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時間感覚テスト | 能力テスト</title>
<meta name="description" content="数字を見ずに経過した時間を当ててみましょう。あなたの時間感覚はどれくらい正確?無料テスト。">
<link rel="canonical" href="https://myabilitytest.com/ja/tests/time-perception">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/ko/tests/time-perception">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/tests/time-perception">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/tests/time-perception">
<link rel="alternate" hreflang="zh-Hant" href="https://myabilitytest.com/zh/tests/time-perception">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/en/tests/time-perception">
<link rel="stylesheet" href="/skill-test/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7993734713843733" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/ja/">← メインへ</a>
    <div class="lang-switch">
      <a href="/ko/tests/time-perception">한국어</a>
      <a href="/en/tests/time-perception">English</a>
      <a class="active" href="/ja/tests/time-perception">日本語</a>
      <a href="/zh/tests/time-perception">中文</a>
    </div>
    <h1>🧭 時間感覚テスト</h1>
    <p class="sub">どれくらい経ったか見えないまま時間が流れます。止まったら時間を当ててみましょう!</p>

    <div id="setupScreen">
      <div class="level-card" style="text-align:left;">
        <div class="label" style="text-align:center; margin-bottom:10px;">参加人数</div>
        <div class="duration-select" id="playerSelect">
          <button data-v="1" class="active">1人</button>
          <button data-v="2">2人</button>
          <button data-v="3">3人</button>
          <button data-v="4">4人</button>
          <button data-v="6">6人</button>
          <button data-v="8">8人</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="startGameBtn">ゲーム開始</button>
      </div>
    </div>

    <div id="playScreen" style="display:none;">
      <div class="timer-orb" id="timerOrb">スタート</div>
      <p class="sub" id="orbHint">押してスタート。どれくらい経ったかは表示されません!</p>

      <div id="guessForm" style="display:none;">
        <p class="sub">止まりました!参加者ごとに予想時間を入力してください。</p>
        <div id="guessList"></div>
        <div class="btn-row">
          <button class="btn" id="submitGuessBtn">まとめて送信</button>
        </div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">🏆</div>
      <h2>最終結果</h2>
      <div class="desc" id="actualReveal"></div>
      <ul class="leaderboard" id="leaderboard"></ul>
      <div class="btn-row">
        <button class="btn" id="retryBtn">もう一度</button>
        <button class="btn share" id="shareBtn">結果を共有</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">挑戦回数</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">最小誤差</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">平均誤差</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 歴代記録ランキング(最大30位)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillTimeGuessStats';
  const LB_KEY = 'skillTimeGuessLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: null, sum: 0 });

  const playerSelect = document.getElementById('playerSelect');
  const setupScreen = document.getElementById('setupScreen');
  const playScreen = document.getElementById('playScreen');
  const timerOrb = document.getElementById('timerOrb');
  const orbHint = document.getElementById('orbHint');
  const guessForm = document.getElementById('guessForm');
  const guessList = document.getElementById('guessList');
  const resultPanel = document.getElementById('resultPanel');

  let playerCount = 1;
  let running = false;
  let actualTime = 0;
  let timeoutId = null;

  playerSelect.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      playerSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playerCount = parseInt(btn.dataset.v, 10);
    });
  });

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best !== null ? stats.best.toFixed(2) + '秒' : '-';
    document.getElementById('statAvg').textContent = stats.count ? (stats.sum / stats.count).toFixed(2) + '秒' : '-';
  }

  function startGame() {
    actualTime = Math.round((1 + Math.random() * 9) * 10) / 10;
    setupScreen.style.display = 'none';
    resultPanel.classList.remove('show');
    playScreen.style.display = '';
    running = false;
    timerOrb.classList.remove('running');
    timerOrb.textContent = 'スタート';
    orbHint.style.display = '';
    guessForm.style.display = 'none';
  }

  timerOrb.addEventListener('click', () => {
    if (running) return;
    running = true;
    timerOrb.classList.add('running');
    timerOrb.textContent = '進行中';
    orbHint.style.display = 'none';
    playStartSound();

    timeoutId = setTimeout(() => {
      running = false;
      timerOrb.classList.remove('running');
      timerOrb.textContent = '停止!';
      playEndSound();
      showGuessForm();
    }, actualTime * 1000);
  });

  function showGuessForm() {
    guessList.innerHTML = '';
    for (let i = 1; i <= playerCount; i++) {
      const row = document.createElement('div');
      row.className = 'guess-list-row';
      row.innerHTML = `<span class="glr-name">参加者 ${i}</span>
        <input type="number" step="0.1" min="0" max="20" placeholder="0.0" data-player="${i}">
        <span class="guess-unit">秒</span>`;
      guessList.appendChild(row);
    }
    guessForm.style.display = '';
    guessList.querySelector('input')?.focus();
  }

  function submitAllGuesses() {
    const inputs = [...guessList.querySelectorAll('input')];
    const results = inputs.map(inp => {
      const guess = parseFloat(inp.value);
      const valid = !isNaN(guess);
      return {
        player: parseInt(inp.dataset.player, 10),
        guess: valid ? guess : null,
        diff: valid ? Math.abs(guess - actualTime) : Infinity,
      };
    });

    if (results.some(r => r.diff === Infinity)) {
      const emptyInput = inputs.find(inp => isNaN(parseFloat(inp.value)));
      emptyInput?.focus();
      return;
    }

    finishGame(results);
  }

  document.getElementById('submitGuessBtn').addEventListener('click', submitAllGuesses);
  guessList.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAllGuesses(); });

  function finishGame(results) {
    playScreen.style.display = 'none';
    const sorted = [...results].sort((a, b) => a.diff - b.diff);

    const best = sorted[0];
    stats.count += 1;
    if (stats.best === null || best.diff < stats.best) stats.best = best.diff;
    stats.sum += best.diff;
    saveStats(STORE_KEY, stats);
    renderStats();

    document.getElementById('actualReveal').textContent = `実際の時間: ${actualTime.toFixed(1)}秒`;

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      return `<li class="${i === 0 ? 'winner' : ''}">
        <span class="rank">${medal}</span>
        <span class="lb-name">参加者 ${r.player}</span>
        <span class="lb-detail">予想 ${r.guess.toFixed(1)}秒(誤差 ${r.diff.toFixed(2)}秒)</span>
      </li>`;
    }).join('');

    resultPanel.classList.add('show');
    resultPanel.dataset.share = playerCount === 1
      ? `時間感覚テストで誤差${best.diff.toFixed(2)}秒を記録!あなたもどうぞ → `
      : `時間感覚テストで参加者${best.player}が誤差${best.diff.toFixed(2)}秒で優勝!あなたもどうぞ → `;

    const lbList = addToLeaderboard(LB_KEY, { value: best.diff, playerCount, date: Date.now() }, true);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">誤差${entry.value.toFixed(2)}秒</span><span class="lb-detail">${entry.playerCount}人 · ${dateStr}</span>`;
    }, 'まだ記録がありません。最初の挑戦をしてみましょう!');
  }

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultPanel.classList.remove('show');
    setupScreen.style.display = '';
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href);
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
</html>
