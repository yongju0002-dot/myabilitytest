<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬間記憶力テスト | 能力テスト</title>
<meta name="description" content="一瞬光ったマスの位置を覚えましょう。レベルが上がるほど難しくなる無料の瞬間記憶力テスト。">
<link rel="canonical" href="https://myabilitytest.com/ja/skill-test/games/memory.html">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/skill-test/games/memory.html">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/skill-test/games/memory.html">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/skill-test/games/memory.html">
<link rel="alternate" hreflang="zh" href="https://myabilitytest.com/zh/skill-test/games/memory.html">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/skill-test/games/memory.html">
<link rel="stylesheet" href="/skill-test/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/ja/index.html">← メインへ</a>
    <div class="lang-switch">
      <a href="/skill-test/games/memory.html">한국어</a>
      <a href="/en/skill-test/games/memory.html">English</a>
      <a class="active" href="/ja/skill-test/games/memory.html">日本語</a>
      <a href="/zh/skill-test/games/memory.html">中文</a>
    </div>
    <h1>🧠 瞬間記憶力テスト</h1>
    <p class="sub">緑色に表示されたマスの位置を覚えて、同じマスをクリックしてください。</p>

    <div class="level-card">
      <div class="label">現在のレベル</div>
      <div class="num" id="levelNum">1</div>
      <div class="sub" id="tilesSub">覚えるマス: 3個</div>
    </div>

    <div class="memory-grid" id="memoryGrid"></div>

    <div class="btn-row" id="startRow">
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">💥</div>
      <h2 id="resultTitle"></h2>
      <div class="stars" id="resultStars"></div>
      <div class="desc" id="resultDesc"></div>
      <div class="percentile" id="resultPercentile"></div>
      <table class="grade-table" id="gradeTable"></table>
      <div class="btn-row">
        <button class="btn" id="retryBtn">もう一度挑戦</button>
        <button class="btn share" id="shareBtn">結果を共有</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">挑戦回数</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">最高レベル</div>
        <div class="value" id="statBest">0</div>
      </div>
      <div class="stat-box">
        <div class="label">最多記憶マス数</div>
        <div class="value" id="statBestTiles">-</div>
      </div>
    </div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillMemoryStats';
  let stats = loadStats(STORE_KEY, { count: 0, best: 0 });
  const grid = document.getElementById('memoryGrid');
  const resultPanel = document.getElementById('resultPanel');
  const startRow = document.getElementById('startRow');

  let level = 1;
  let over = false;
  let gridSize = 3;
  let targets = new Set();
  let remaining = new Set();
  let locked = true;

  function tilesFor(lv) { return lv + 2; }

  function gridSizeFor(tiles) {
    if (tiles <= 4) return 3;
    if (tiles <= 7) return 4;
    if (tiles <= 11) return 5;
    if (tiles <= 16) return 6;
    return 7;
  }

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best;
    document.getElementById('statBestTiles').textContent = stats.best ? tilesFor(stats.best) + '個' : '-';
  }

  function rankText(lv) {
    if (lv >= 20) return `レベル${lv}!天才的な記憶力です。上位1%!`;
    if (lv >= 16) return `レベル${lv}!卓越した記憶力です。上位3%!`;
    if (lv >= 13) return `レベル${lv}!素晴らしい記憶力です。上位10%!`;
    if (lv >= 9) return `レベル${lv}!良い記憶力です。上位20%。`;
    if (lv >= 5) return `レベル${lv}、平均的な記憶力です。`;
    return `レベル${lv}。もう一度挑戦してみましょう!`;
  }

  const GRADES = [
    { key: 'SS', min: 20, label: 'SS · 天才的' },
    { key: 'S', min: 16, label: 'S · 卓越' },
    { key: 'A', min: 13, label: 'A · 素晴らしい' },
    { key: 'B', min: 9, label: 'B · 良い' },
    { key: 'C', min: 5, label: 'C · 平均' },
    { key: 'D', min: 2, label: 'D · やや残念' },
    { key: 'F', min: 0, label: 'F · 序盤で失敗' },
  ];

  function gradeFor(lv) {
    return GRADES.find(g => lv >= g.min) || GRADES[GRADES.length - 1];
  }

  function starsFor(lv) {
    if (lv >= 16) return 5;
    if (lv >= 13) return 4;
    if (lv >= 9) return 3;
    if (lv >= 5) return 2;
    return 1;
  }

  function renderGradeTable(lv) {
    const grade = gradeFor(lv);
    const table = document.getElementById('gradeTable');
    table.innerHTML = '<tr><th>ランク</th><th>基準レベル</th></tr>' +
      GRADES.map(g => `<tr class="${g.key === grade.key ? 'current-row' : ''}"><td>${g.label}</td><td>${g.min}+</td></tr>`).join('');
  }

  function buildGrid() {
    const tiles = tilesFor(level);
    gridSize = gridSizeFor(tiles);
    const total = gridSize * gridSize;
    grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    grid.innerHTML = '';

    targets = new Set();
    while (targets.size < tiles) targets.add(Math.floor(Math.random() * total));
    remaining = new Set(targets);

    document.getElementById('levelNum').textContent = level;
    document.getElementById('tilesSub').textContent = `覚えるマス: ${tiles}個 (${gridSize}x${gridSize})`;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'memory-cell';
      cell.dataset.i = i;
      cell.addEventListener('click', () => pick(i, cell));
      grid.appendChild(cell);
    }
  }

  function showTargets() {
    locked = true;
    targets.forEach(i => grid.children[i].classList.add('show-target'));
    const showTime = 800 + gridSize * 150;
    setTimeout(() => {
      targets.forEach(i => grid.children[i].classList.remove('show-target'));
      locked = false;
    }, showTime);
  }

  function pick(i, cell) {
    if (locked || over || cell.classList.contains('disabled')) return;

    if (targets.has(i)) {
      cell.classList.add('disabled', 'picked-correct');
      remaining.delete(i);
      if (remaining.size === 0) {
        locked = true;
        setTimeout(() => { level += 1; buildGrid(); showTargets(); }, 600);
      }
    } else {
      cell.classList.add('disabled', 'picked-wrong');
      locked = true;
      targets.forEach(idx => grid.children[idx].classList.add('show-target'));
      [...grid.children].forEach(c => c.classList.add('disabled'));
      setTimeout(() => endGame(), 700);
    }
  }

  function endGame() {
    over = true;
    const reached = level;
    stats.count += 1;
    if (reached > stats.best) stats.best = reached;
    saveStats(STORE_KEY, stats);
    renderStats();

    const grade = gradeFor(reached);
    const stars = starsFor(reached);
    document.getElementById('resultTitle').textContent = 'レベル' + reached + 'で失敗!';
    document.getElementById('resultStars').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
    document.getElementById('resultDesc').textContent = `${tilesFor(reached)}個のマスを覚える必要がありました。`;
    document.getElementById('resultPercentile').textContent = rankText(reached);
    renderGradeTable(reached);
    resultPanel.classList.add('show');
    resultPanel.dataset.share = `瞬間記憶力テストでレベル${reached}達成!(${grade.key}ランク)あなたもどうぞ → `;
  }

  function reset() {
    level = 1;
    over = false;
    resultPanel.classList.remove('show');
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  });
  document.getElementById('retryBtn').addEventListener('click', reset);
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href.replace('games/memory.html', ''));
  });

  renderStats();
</script>
</body>
</html>
