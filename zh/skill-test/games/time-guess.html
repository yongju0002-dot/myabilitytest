<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间感知测试 | 能力测试</title>
<meta name="description" content="不看数字,猜猜流逝的时间。0.5秒~10秒之间,你的时间感知有多准确?免费测试。">
<link rel="canonical" href="https://myabilitytest.com/zh/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="zh" href="https://myabilitytest.com/zh/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/skill-test/games/time-guess.html">
<link rel="stylesheet" href="/skill-test/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/zh/index.html">← 返回主页</a>
    <div class="lang-switch">
      <a href="/skill-test/games/time-guess.html">한국어</a>
      <a href="/en/skill-test/games/time-guess.html">English</a>
      <a href="/ja/skill-test/games/time-guess.html">日本語</a>
      <a class="active" href="/zh/skill-test/games/time-guess.html">中文</a>
    </div>
    <h1>🧭 时间感知测试</h1>
    <p class="sub">0.5秒~10.0秒之间,不显示流逝了多久。停止后猜猜时间吧!</p>

    <div id="setupScreen">
      <div class="level-card" style="text-align:left;">
        <div class="label" style="text-align:center; margin-bottom:10px;">参与人数</div>
        <div class="duration-select" id="playerSelect">
          <button data-v="1" class="active">1人</button>
          <button data-v="2">2人</button>
          <button data-v="3">3人</button>
          <button data-v="4">4人</button>
          <button data-v="6">6人</button>
          <button data-v="8">8人</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="startGameBtn">开始游戏</button>
      </div>
    </div>

    <div id="playScreen" style="display:none;">
      <div class="timer-orb" id="timerOrb">开始</div>
      <p class="sub" id="orbHint">点击开始。不会显示经过了多少时间!</p>

      <div id="guessForm" style="display:none;">
        <p class="sub">停止了!请为每位参与者输入预估时间。</p>
        <div id="guessList"></div>
        <div class="btn-row">
          <button class="btn" id="submitGuessBtn">全部提交</button>
        </div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">🏆</div>
      <h2>最终结果</h2>
      <div class="desc" id="actualReveal"></div>
      <ul class="leaderboard" id="leaderboard"></ul>
      <div class="btn-row">
        <button class="btn" id="retryBtn">再玩一次</button>
        <button class="btn share" id="shareBtn">分享结果</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">挑战次数</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">最小误差</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">平均误差</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillTimeGuessStats';
  let stats = loadStats(STORE_KEY, { count: 0, best: null, sum: 0 });

  const playerSelect = document.getElementById('playerSelect');
  const setupScreen = document.getElementById('setupScreen');
  const playScreen = document.getElementById('playScreen');
  const timerOrb = document.getElementById('timerOrb');
  const orbHint = document.getElementById('orbHint');
  const guessForm = document.getElementById('guessForm');
  const guessList = document.getElementById('guessList');
  const resultPanel = document.getElementById('resultPanel');

  let playerCount = 1;
  let running = false;
  let actualTime = 0;
  let timeoutId = null;

  playerSelect.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      playerSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playerCount = parseInt(btn.dataset.v, 10);
    });
  });

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best !== null ? stats.best.toFixed(2) + '秒' : '-';
    document.getElementById('statAvg').textContent = stats.count ? (stats.sum / stats.count).toFixed(2) + '秒' : '-';
  }

  function startGame() {
    actualTime = Math.round((0.5 + Math.random() * 9.5) * 10) / 10;
    setupScreen.style.display = 'none';
    resultPanel.classList.remove('show');
    playScreen.style.display = '';
    running = false;
    timerOrb.classList.remove('running');
    timerOrb.textContent = '开始';
    orbHint.style.display = '';
    guessForm.style.display = 'none';
  }

  timerOrb.addEventListener('click', () => {
    if (running) return;
    running = true;
    timerOrb.classList.add('running');
    timerOrb.textContent = '进行中';
    orbHint.style.display = 'none';
    playStartSound();

    timeoutId = setTimeout(() => {
      running = false;
      timerOrb.classList.remove('running');
      timerOrb.textContent = '停止!';
      playEndSound();
      showGuessForm();
    }, actualTime * 1000);
  });

  function showGuessForm() {
    guessList.innerHTML = '';
    for (let i = 1; i <= playerCount; i++) {
      const row = document.createElement('div');
      row.className = 'guess-list-row';
      row.innerHTML = `<span class="glr-name">参与者 ${i}</span>
        <input type="number" step="0.1" min="0" max="20" placeholder="0.0" data-player="${i}">
        <span class="guess-unit">秒</span>`;
      guessList.appendChild(row);
    }
    guessForm.style.display = '';
    guessList.querySelector('input')?.focus();
  }

  function submitAllGuesses() {
    const inputs = [...guessList.querySelectorAll('input')];
    const results = inputs.map(inp => {
      const guess = parseFloat(inp.value);
      const valid = !isNaN(guess);
      return {
        player: parseInt(inp.dataset.player, 10),
        guess: valid ? guess : null,
        diff: valid ? Math.abs(guess - actualTime) : Infinity,
      };
    });

    if (results.some(r => r.diff === Infinity)) {
      const emptyInput = inputs.find(inp => isNaN(parseFloat(inp.value)));
      emptyInput?.focus();
      return;
    }

    finishGame(results);
  }

  document.getElementById('submitGuessBtn').addEventListener('click', submitAllGuesses);
  guessList.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAllGuesses(); });

  function finishGame(results) {
    playScreen.style.display = 'none';
    const sorted = [...results].sort((a, b) => a.diff - b.diff);

    const best = sorted[0];
    stats.count += 1;
    if (stats.best === null || best.diff < stats.best) stats.best = best.diff;
    stats.sum += best.diff;
    saveStats(STORE_KEY, stats);
    renderStats();

    document.getElementById('actualReveal').textContent = `实际时间: ${actualTime.toFixed(1)}秒`;

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      return `<li class="${i === 0 ? 'winner' : ''}">
        <span class="rank">${medal}</span>
        <span class="lb-name">参与者 ${r.player}</span>
        <span class="lb-detail">预估 ${r.guess.toFixed(1)}秒(误差 ${r.diff.toFixed(2)}秒)</span>
      </li>`;
    }).join('');

    resultPanel.classList.add('show');
    resultPanel.dataset.share = playerCount === 1
      ? `我在时间感知测试中误差仅${best.diff.toFixed(2)}秒!你也来试试 → `
      : `参与者${best.player}以${best.diff.toFixed(2)}秒的误差赢得了时间感知测试!你也来试试 → `;
  }

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultPanel.classList.remove('show');
    setupScreen.style.display = '';
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href.replace('games/time-guess.html', ''));
  });

  renderStats();
</script>
</body>
</html>
