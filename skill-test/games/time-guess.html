<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간 감각 테스트 | 능력 테스트</title>
<meta name="description" content="숫자를 보지 않고 흐른 시간을 맞혀보세요. 나의 시간 감각은 얼마나 정확할까? 무료 테스트.">
<link rel="canonical" href="https://myabilitytest.com/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="zh" href="https://myabilitytest.com/zh/skill-test/games/time-guess.html">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/skill-test/games/time-guess.html">
<link rel="stylesheet" href="/skill-test/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7993734713843733" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../../index.html">← 메인으로</a>
    <div class="lang-switch">
      <a class="active" href="/skill-test/games/time-guess.html">한국어</a>
      <a href="/en/skill-test/games/time-guess.html">English</a>
      <a href="/ja/skill-test/games/time-guess.html">日本語</a>
      <a href="/zh/skill-test/games/time-guess.html">中文</a>
    </div>
    <h1>🧭 시간 감각 테스트</h1>
    <p class="sub">얼마나 지났는지 보지 않고 시간이 흘러갑니다. 멈추면 시간을 맞혀보세요!</p>

    <div id="setupScreen">
      <div class="level-card" style="text-align:left;">
        <div class="label" style="text-align:center; margin-bottom:10px;">참가 인원</div>
        <div class="duration-select" id="playerSelect">
          <button data-v="1" class="active">1인</button>
          <button data-v="2">2인</button>
          <button data-v="3">3인</button>
          <button data-v="4">4인</button>
          <button data-v="6">6인</button>
          <button data-v="8">8인</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="startGameBtn">게임 시작</button>
      </div>
    </div>

    <div id="playScreen" style="display:none;">
      <div class="timer-orb" id="timerOrb">시작</div>
      <p class="sub" id="orbHint">눌러서 시작하세요. 얼마나 흘렀는지 보이지 않습니다!</p>

      <div id="guessForm" style="display:none;">
        <p class="sub">멈췄습니다! 참가자별로 예상 시간을 적어주세요.</p>
        <div id="guessList"></div>
        <div class="btn-row">
          <button class="btn" id="submitGuessBtn">전체 제출</button>
        </div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">🏆</div>
      <h2>최종 결과</h2>
      <div class="desc" id="actualReveal"></div>
      <ul class="leaderboard" id="leaderboard"></ul>
      <div class="btn-row">
        <button class="btn" id="retryBtn">다시 하기</button>
        <button class="btn share" id="shareBtn">결과 공유하기</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">도전 횟수</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">최소 오차</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">평균 오차</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 역대 기록 순위 (최대 30위)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillTimeGuessStats';
  const LB_KEY = 'skillTimeGuessLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: null, sum: 0 });

  const playerSelect = document.getElementById('playerSelect');
  const setupScreen = document.getElementById('setupScreen');
  const playScreen = document.getElementById('playScreen');
  const timerOrb = document.getElementById('timerOrb');
  const orbHint = document.getElementById('orbHint');
  const guessForm = document.getElementById('guessForm');
  const guessList = document.getElementById('guessList');
  const resultPanel = document.getElementById('resultPanel');

  let playerCount = 1;
  let running = false;
  let actualTime = 0;
  let timeoutId = null;

  playerSelect.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      playerSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playerCount = parseInt(btn.dataset.v, 10);
    });
  });

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best !== null ? stats.best.toFixed(2) + '초' : '-';
    document.getElementById('statAvg').textContent = stats.count ? (stats.sum / stats.count).toFixed(2) + '초' : '-';
  }

  function startGame() {
    actualTime = Math.round((1 + Math.random() * 9) * 10) / 10;
    setupScreen.style.display = 'none';
    resultPanel.classList.remove('show');
    playScreen.style.display = '';
    running = false;
    timerOrb.classList.remove('running');
    timerOrb.textContent = '시작';
    orbHint.style.display = '';
    guessForm.style.display = 'none';
  }

  timerOrb.addEventListener('click', () => {
    if (running) return;
    running = true;
    timerOrb.classList.add('running');
    timerOrb.textContent = '진행 중';
    orbHint.style.display = 'none';
    playStartSound();

    timeoutId = setTimeout(() => {
      running = false;
      timerOrb.classList.remove('running');
      timerOrb.textContent = '멈춤!';
      playEndSound();
      showGuessForm();
    }, actualTime * 1000);
  });

  function showGuessForm() {
    guessList.innerHTML = '';
    for (let i = 1; i <= playerCount; i++) {
      const row = document.createElement('div');
      row.className = 'guess-list-row';
      row.innerHTML = `<span class="glr-name">참가자 ${i}</span>
        <input type="number" step="0.1" min="0" max="20" placeholder="0.0" data-player="${i}">
        <span class="guess-unit">초</span>`;
      guessList.appendChild(row);
    }
    guessForm.style.display = '';
    guessList.querySelector('input')?.focus();
  }

  function submitAllGuesses() {
    const inputs = [...guessList.querySelectorAll('input')];
    const results = inputs.map(inp => {
      const guess = parseFloat(inp.value);
      const valid = !isNaN(guess);
      return {
        player: parseInt(inp.dataset.player, 10),
        guess: valid ? guess : null,
        diff: valid ? Math.abs(guess - actualTime) : Infinity,
      };
    });

    if (results.some(r => r.diff === Infinity)) {
      const emptyInput = inputs.find(inp => isNaN(parseFloat(inp.value)));
      emptyInput?.focus();
      return;
    }

    finishGame(results);
  }

  document.getElementById('submitGuessBtn').addEventListener('click', submitAllGuesses);
  guessList.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAllGuesses(); });

  function finishGame(results) {
    playScreen.style.display = 'none';
    const sorted = [...results].sort((a, b) => a.diff - b.diff);

    const best = sorted[0];
    stats.count += 1;
    if (stats.best === null || best.diff < stats.best) stats.best = best.diff;
    stats.sum += best.diff;
    saveStats(STORE_KEY, stats);
    renderStats();

    document.getElementById('actualReveal').textContent = `실제 시간: ${actualTime.toFixed(1)}초`;

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      return `<li class="${i === 0 ? 'winner' : ''}">
        <span class="rank">${medal}</span>
        <span class="lb-name">참가자 ${r.player}</span>
        <span class="lb-detail">예상 ${r.guess.toFixed(1)}초 (오차 ${r.diff.toFixed(2)}초)</span>
      </li>`;
    }).join('');

    resultPanel.classList.add('show');
    resultPanel.dataset.share = playerCount === 1
      ? `시간 감각 테스트에서 오차 ${best.diff.toFixed(2)}초! 너도 해봐 → `
      : `시간 감각 테스트에서 참가자 ${best.player}이(가) 오차 ${best.diff.toFixed(2)}초로 우승! 너도 해봐 → `;

    const lbList = addToLeaderboard(LB_KEY, { value: best.diff, playerCount, date: Date.now() }, true);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">오차 ${entry.value.toFixed(2)}초</span><span class="lb-detail">${entry.playerCount}인 · ${dateStr}</span>`;
    }, '아직 기록이 없어요. 첫 도전을 해보세요!');
  }

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultPanel.classList.remove('show');
    setupScreen.style.display = '';
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href.replace('games/time-guess.html', ''));
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
</html>
