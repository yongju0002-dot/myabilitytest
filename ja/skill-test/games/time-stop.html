<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時間ストップゲーム | 能力テスト</title>
<meta name="description" content="時計を見ずに目標時間ぴったりで止めよう!みんなで楽しめる無料の時間感覚ゲーム。">
<link rel="canonical" href="https://myabilitytest.com/ja/skill-test/games/time-stop.html">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/skill-test/games/time-stop.html">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/skill-test/games/time-stop.html">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/skill-test/games/time-stop.html">
<link rel="alternate" hreflang="zh" href="https://myabilitytest.com/zh/skill-test/games/time-stop.html">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/skill-test/games/time-stop.html">
<link rel="stylesheet" href="/skill-test/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/ja/index.html">← メインへ</a>
    <div class="lang-switch">
      <a href="/skill-test/games/time-stop.html">한국어</a>
      <a href="/en/skill-test/games/time-stop.html">English</a>
      <a class="active" href="/ja/skill-test/games/time-stop.html">日本語</a>
      <a href="/zh/skill-test/games/time-stop.html">中文</a>
    </div>
    <h1>⏱️ 時間ストップゲーム</h1>
    <p class="sub">時計を見ずに、目標の時間になったと思った瞬間に押してみましょう!</p>

    <div id="setupScreen">
      <div class="level-card" style="text-align:left;">
        <div class="label" style="text-align:center; margin-bottom:10px;">参加人数</div>
        <div class="duration-select" id="playerSelect">
          <button data-v="1" class="active">1人</button>
          <button data-v="2">2人</button>
          <button data-v="3">3人</button>
          <button data-v="4">4人</button>
          <button data-v="6">6人</button>
          <button data-v="8">8人</button>
        </div>
        <div class="label" style="text-align:center; margin:16px 0 10px;">目標時間</div>
        <div class="duration-select" id="targetSelect">
          <button data-v="5">5秒</button>
          <button data-v="10" class="active">10秒</button>
          <button data-v="15">15秒</button>
          <button data-v="20">20秒</button>
          <button data-v="30">30秒</button>
        </div>
        <div class="setup-toggle">
          <label><input type="checkbox" id="blindToggle" checked> 結果を隠す(全員終了後に一斉公開)</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="startGameBtn">ゲーム開始</button>
      </div>
    </div>

    <div id="playScreen" style="display:none;">
      <div class="player-badge">
        <div class="who">参加者</div>
        <div class="num" id="playerNum">1</div>
        <div class="who" id="playerSub">/ 1 · 目標10秒</div>
      </div>

      <div class="timer-orb" id="timerOrb">スタート</div>

      <div id="turnResult" class="result-panel">
        <div class="emoji">⏱️</div>
        <h2 id="turnTitle"></h2>
        <div class="desc" id="turnDesc"></div>
        <div class="btn-row">
          <button class="btn" id="nextPlayerBtn">次の参加者</button>
        </div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">🏆</div>
      <h2>最終結果</h2>
      <ul class="leaderboard" id="leaderboard"></ul>
      <div class="btn-row">
        <button class="btn" id="retryBtn">もう一度</button>
        <button class="btn share" id="shareBtn">結果を共有</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">挑戦回数</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">最小誤差</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">平均誤差</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 歴代記録ランキング(最大30位)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillTimeStopStats';
  const LB_KEY = 'skillTimeStopLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: null, sum: 0 });

  const playerSelect = document.getElementById('playerSelect');
  const targetSelect = document.getElementById('targetSelect');
  const blindToggle = document.getElementById('blindToggle');
  const setupScreen = document.getElementById('setupScreen');
  const playScreen = document.getElementById('playScreen');
  const timerOrb = document.getElementById('timerOrb');
  const turnResult = document.getElementById('turnResult');
  const resultPanel = document.getElementById('resultPanel');

  let playerCount = 1;
  let targetTime = 10;
  let blind = true;
  let currentPlayer = 0;
  let running = false;
  let turnDone = false;
  let startTime = 0;
  let results = [];

  function selectButtons(container, onPick) {
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        onPick(parseFloat(btn.dataset.v));
      });
    });
  }
  selectButtons(playerSelect, v => playerCount = v);
  selectButtons(targetSelect, v => targetTime = v);

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best !== null ? stats.best.toFixed(2) + '秒' : '-';
    document.getElementById('statAvg').textContent = stats.count ? (stats.sum / stats.count).toFixed(2) + '秒' : '-';
  }

  function startGame() {
    blind = blindToggle.checked;
    currentPlayer = 0;
    results = [];
    setupScreen.style.display = 'none';
    resultPanel.classList.remove('show');
    playScreen.style.display = '';
    startTurn();
  }

  function startTurn() {
    running = false;
    turnDone = false;
    timerOrb.classList.remove('running', 'disabled');
    timerOrb.textContent = 'スタート';
    document.getElementById('playerNum').textContent = currentPlayer + 1;
    document.getElementById('playerSub').textContent = `/ ${playerCount} · 目標${targetTime}秒`;
    turnResult.classList.remove('show');
  }

  timerOrb.addEventListener('click', () => {
    if (turnDone) return;
    if (!running) {
      running = true;
      startTime = performance.now();
      timerOrb.classList.add('running');
      timerOrb.textContent = 'ストップ!';
      playStartSound();
      return;
    }
    running = false;
    turnDone = true;
    timerOrb.classList.remove('running');
    timerOrb.classList.add('disabled');
    playEndSound();
    const elapsed = (performance.now() - startTime) / 1000;
    const diff = Math.abs(elapsed - targetTime);
    results.push({ player: currentPlayer + 1, elapsed, diff });

    document.getElementById('turnTitle').textContent = blind ? '記録完了!' : elapsed.toFixed(2) + '秒';
    document.getElementById('turnDesc').textContent = blind
      ? '結果は全員終了後に公開されます。'
      : `目標${targetTime}秒 — 誤差${diff.toFixed(2)}秒`;
    turnResult.classList.add('show');
  });

  document.getElementById('nextPlayerBtn').addEventListener('click', () => {
    currentPlayer += 1;
    if (currentPlayer >= playerCount) {
      finishGame();
    } else {
      startTurn();
    }
  });

  function finishGame() {
    playScreen.style.display = 'none';
    const sorted = [...results].sort((a, b) => a.diff - b.diff);

    const best = sorted[0];
    stats.count += 1;
    if (stats.best === null || best.diff < stats.best) stats.best = best.diff;
    stats.sum += best.diff;
    saveStats(STORE_KEY, stats);
    renderStats();

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      return `<li class="${i === 0 ? 'winner' : ''}">
        <span class="rank">${medal}</span>
        <span class="lb-name">参加者 ${r.player}</span>
        <span class="lb-detail">${r.elapsed.toFixed(2)}秒(誤差${r.diff.toFixed(2)}秒)</span>
      </li>`;
    }).join('');

    resultPanel.classList.add('show');
    resultPanel.dataset.share = playerCount === 1
      ? `時間ストップゲームで目標${targetTime}秒、誤差${best.diff.toFixed(2)}秒を記録!あなたもどうぞ → `
      : `時間ストップゲームで参加者${best.player}が誤差${best.diff.toFixed(2)}秒で優勝!あなたもどうぞ → `;

    const lbList = addToLeaderboard(LB_KEY, { value: best.diff, targetTime, playerCount, date: Date.now() }, true);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">誤差${entry.value.toFixed(2)}秒</span><span class="lb-detail">目標${entry.targetTime}秒 · ${entry.playerCount}人 · ${dateStr}</span>`;
    }, 'まだ記録がありません。最初の挑戦をしてみましょう!');
  }

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultPanel.classList.remove('show');
    setupScreen.style.display = '';
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href.replace('games/time-stop.html', ''));
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
</html>
