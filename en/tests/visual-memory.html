<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Memory Test | Ability Test</title>
<meta name="description" content="Remember the flashed tile positions. Free visual memory test that gets harder as you level up.">
<link rel="canonical" href="https://myabilitytest.com/en/tests/visual-memory">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/ko/tests/visual-memory">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/tests/visual-memory">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/tests/visual-memory">
<link rel="alternate" hreflang="zh-Hant" href="https://myabilitytest.com/zh/tests/visual-memory">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/en/tests/visual-memory">
<link rel="stylesheet" href="/skill-test/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7993734713843733" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/en/">← Back to Main</a>
    <div class="lang-switch">
      <a href="/ko/tests/visual-memory">한국어</a>
      <a class="active" href="/en/tests/visual-memory">English</a>
      <a href="/ja/tests/visual-memory">日本語</a>
      <a href="/zh/tests/visual-memory">中文</a>
    </div>
    <h1>🧠 Visual Memory Test</h1>
    <p class="sub">Remember the tiles shown in green, then click those same tiles.</p>

    <div class="level-card">
      <div class="label">Current level</div>
      <div class="num" id="levelNum">1</div>
      <div class="sub" id="tilesSub">Tiles to remember: 3</div>
    </div>

    <div class="memory-grid" id="memoryGrid"></div>

    <div class="btn-row" id="startRow">
      <button class="btn" id="startBtn">Start</button>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">💥</div>
      <h2 id="resultTitle"></h2>
      <div class="stars" id="resultStars"></div>
      <div class="desc" id="resultDesc"></div>
      <div class="percentile" id="resultPercentile"></div>
      <table class="grade-table" id="gradeTable"></table>
      <div class="btn-row">
        <button class="btn" id="retryBtn">Try again</button>
        <button class="btn share" id="shareBtn">Share result</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">Attempts</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">Best level</div>
        <div class="value" id="statBest">0</div>
      </div>
      <div class="stat-box">
        <div class="label">Most tiles remembered</div>
        <div class="value" id="statBestTiles">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 All-Time Top Records (Top 30)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillMemoryStats';
  const LB_KEY = 'skillMemoryLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: 0 });
  const grid = document.getElementById('memoryGrid');
  const resultPanel = document.getElementById('resultPanel');
  const startRow = document.getElementById('startRow');

  let level = 1;
  let over = false;
  let gridSize = 3;
  let targets = new Set();
  let remaining = new Set();
  let locked = true;

  function tilesFor(lv) { return lv + 2; }

  function gridSizeFor(tiles) {
    if (tiles <= 4) return 3;
    if (tiles <= 7) return 4;
    if (tiles <= 11) return 5;
    if (tiles <= 16) return 6;
    return 7;
  }

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best;
    document.getElementById('statBestTiles').textContent = stats.best ? tilesFor(stats.best) : '-';
  }

  function rankText(lv) {
    if (lv >= 20) return `Level ${lv}! Genius-level memory. Top 1%!`;
    if (lv >= 16) return `Level ${lv}! Outstanding memory. Top 3%!`;
    if (lv >= 13) return `Level ${lv}! Excellent memory. Top 10%!`;
    if (lv >= 9) return `Level ${lv}! Good memory. Top 20%.`;
    if (lv >= 5) return `Level ${lv}, average memory.`;
    return `Level ${lv}. Try again!`;
  }

  const GRADES = [
    { key: 'SS', min: 20, label: 'SS · Genius' },
    { key: 'S', min: 16, label: 'S · Outstanding' },
    { key: 'A', min: 13, label: 'A · Excellent' },
    { key: 'B', min: 9, label: 'B · Good' },
    { key: 'C', min: 5, label: 'C · Average' },
    { key: 'D', min: 2, label: 'D · Below average' },
    { key: 'F', min: 0, label: 'F · Early fail' },
  ];

  function gradeFor(lv) {
    return GRADES.find(g => lv >= g.min) || GRADES[GRADES.length - 1];
  }

  function starsFor(lv) {
    if (lv >= 16) return 5;
    if (lv >= 13) return 4;
    if (lv >= 9) return 3;
    if (lv >= 5) return 2;
    return 1;
  }

  function renderGradeTable(lv) {
    const grade = gradeFor(lv);
    const table = document.getElementById('gradeTable');
    table.innerHTML = '<tr><th>Grade</th><th>Level threshold</th></tr>' +
      GRADES.map(g => `<tr class="${g.key === grade.key ? 'current-row' : ''}"><td>${g.label}</td><td>${g.min}+</td></tr>`).join('');
  }

  function buildGrid() {
    const tiles = tilesFor(level);
    gridSize = gridSizeFor(tiles);
    const total = gridSize * gridSize;
    grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    grid.innerHTML = '';

    targets = new Set();
    while (targets.size < tiles) targets.add(Math.floor(Math.random() * total));
    remaining = new Set(targets);

    document.getElementById('levelNum').textContent = level;
    document.getElementById('tilesSub').textContent = `Tiles to remember: ${tiles} (${gridSize}x${gridSize})`;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'memory-cell';
      cell.dataset.i = i;
      cell.addEventListener('click', () => pick(i, cell));
      grid.appendChild(cell);
    }
  }

  function showTargets() {
    locked = true;
    targets.forEach(i => grid.children[i].classList.add('show-target'));
    const showTime = 800 + gridSize * 150;
    setTimeout(() => {
      targets.forEach(i => grid.children[i].classList.remove('show-target'));
      locked = false;
    }, showTime);
  }

  function pick(i, cell) {
    if (locked || over || cell.classList.contains('disabled')) return;

    if (targets.has(i)) {
      cell.classList.add('disabled', 'picked-correct');
      remaining.delete(i);
      if (remaining.size === 0) {
        locked = true;
        setTimeout(() => { level += 1; buildGrid(); showTargets(); }, 600);
      }
    } else {
      cell.classList.add('disabled', 'picked-wrong');
      locked = true;
      targets.forEach(idx => grid.children[idx].classList.add('show-target'));
      [...grid.children].forEach(c => c.classList.add('disabled'));
      setTimeout(() => endGame(), 700);
    }
  }

  function endGame() {
    over = true;
    const reached = level;
    stats.count += 1;
    if (reached > stats.best) stats.best = reached;
    saveStats(STORE_KEY, stats);
    renderStats();

    const grade = gradeFor(reached);
    const stars = starsFor(reached);
    document.getElementById('resultTitle').textContent = 'Failed at level ' + reached + '!';
    document.getElementById('resultStars').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
    document.getElementById('resultDesc').textContent = `You needed to remember ${tilesFor(reached)} tiles.`;
    document.getElementById('resultPercentile').textContent = rankText(reached);
    renderGradeTable(reached);
    resultPanel.classList.add('show');
    resultPanel.dataset.share = `I reached level ${reached} (grade ${grade.key}) on the Visual Memory Test! Try it yourself → `;

    const lbList = addToLeaderboard(LB_KEY, { value: reached, date: Date.now() }, false);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">Level ${entry.value}</span><span class="lb-detail">${dateStr}</span>`;
    }, 'No records yet. Try your first challenge!');
  }

  function reset() {
    level = 1;
    over = false;
    resultPanel.classList.remove('show');
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  });
  document.getElementById('retryBtn').addEventListener('click', reset);
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href);
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
</html>
