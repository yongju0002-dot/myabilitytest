<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS点击速度测试 | 能力测试</title>
<meta name="description" content="限定时间内你能点击多快?免费CPS(每秒点击数)测试,附实时曲线图。">
<link rel="canonical" href="https://myabilitytest.com/zh/skill-test/games/cps.html">
<link rel="alternate" hreflang="ko" href="https://myabilitytest.com/skill-test/games/cps.html">
<link rel="alternate" hreflang="en" href="https://myabilitytest.com/en/skill-test/games/cps.html">
<link rel="alternate" hreflang="ja" href="https://myabilitytest.com/ja/skill-test/games/cps.html">
<link rel="alternate" hreflang="zh" href="https://myabilitytest.com/zh/skill-test/games/cps.html">
<link rel="alternate" hreflang="x-default" href="https://myabilitytest.com/skill-test/games/cps.html">
<link rel="stylesheet" href="/skill-test/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7993734713843733" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/zh/index.html">← 返回主页</a>
    <div class="lang-switch">
      <a href="/skill-test/games/cps.html">한국어</a>
      <a href="/en/skill-test/games/cps.html">English</a>
      <a href="/ja/skill-test/games/cps.html">日本語</a>
      <a class="active" href="/zh/skill-test/games/cps.html">中文</a>
    </div>
    <h1>🖱️ CPS点击速度测试</h1>
    <p class="sub">在限定时间内尽可能快速点击!</p>

    <div class="duration-select" id="durationSelect"></div>

    <div class="level-card">
      <div class="label">剩余时间</div>
      <div class="countdown-num" id="timeLeft">5.0</div>
      <div class="sub" id="clickCountLine">点击数: 0 · 实时CPS: 0.0</div>
      <canvas class="cps-graph" id="cpsGraph"></canvas>
    </div>

    <button class="click-pad" id="clickPad">START</button>

    <div id="resultPanel" class="result-panel">
      <div class="emoji" id="resultEmoji">🖱️</div>
      <h2 id="resultTitle"></h2>
      <div class="stars" id="resultStars"></div>
      <div class="desc" id="resultDesc"></div>
      <table class="grade-table" id="gradeTable"></table>
      <div class="btn-row">
        <button class="btn" id="retryBtn">再玩一次</button>
        <button class="btn share" id="shareBtn">分享结果</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label" id="statCountLabel">此时长游玩次数</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">此时长最高CPS</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">此时长最多点击</div>
        <div class="value" id="statBestClicks">-</div>
      </div>
    </div>

    <div class="info-box">
      CPS = 点击数 ÷ 时间(秒)。像1~3秒这样的短测试,因为是爆发力所以CPS往往更高。
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 历代记录排行(最多30位)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const DURATIONS = [1, 3, 5, 10, 15, 30, 60];
  const STORE_KEY = 'skillCpsStatsV2';
  const LB_KEY = 'skillCpsLeaderboardV1';
  let allStats = loadStats(STORE_KEY, {});

  const durationSelect = document.getElementById('durationSelect');
  const clickPad = document.getElementById('clickPad');
  const timeLeftEl = document.getElementById('timeLeft');
  const clickCountLine = document.getElementById('clickCountLine');
  const resultPanel = document.getElementById('resultPanel');
  const graphCanvas = document.getElementById('cpsGraph');
  const graphCtx = graphCanvas.getContext('2d');

  let duration = 5;
  let running = false;
  let finished = false;
  let clicks = 0;
  let startTime = 0;
  let rafId = null;
  let samples = [];

  const GRADES = [
    { key: 'SS', min: 12, label: 'SS · 超高速' },
    { key: 'S', min: 10, label: 'S · 非常快' },
    { key: 'A', min: 8, label: 'A · 快' },
    { key: 'B', min: 6, label: 'B · 高于平均' },
    { key: 'C', min: 4, label: 'C · 平均' },
    { key: 'D', min: 2, label: 'D · 悠闲' },
    { key: 'F', min: 0, label: 'F · 非常悠闲' },
  ];

  function getDurStats(d) {
    return allStats[d] || { plays: 0, bestCps: 0, bestClicks: 0 };
  }

  function resizeGraph() {
    const rect = graphCanvas.getBoundingClientRect();
    graphCanvas.width = rect.width * devicePixelRatio;
    graphCanvas.height = rect.height * devicePixelRatio;
  }

  function drawGraph() {
    const w = graphCanvas.width, h = graphCanvas.height;
    graphCtx.clearRect(0, 0, w, h);
    if (samples.length < 2) return;
    const maxCps = Math.max(5, ...samples.map(s => s.cps)) * 1.15;
    graphCtx.beginPath();
    samples.forEach((s, i) => {
      const x = (s.t / duration) * w;
      const y = h - (s.cps / maxCps) * h;
      if (i === 0) graphCtx.moveTo(x, y);
      else graphCtx.lineTo(x, y);
    });
    graphCtx.strokeStyle = '#a5b4fc';
    graphCtx.lineWidth = 2 * devicePixelRatio;
    graphCtx.stroke();
  }

  function renderDurationButtons() {
    durationSelect.innerHTML = '';
    DURATIONS.forEach(d => {
      const ds = getDurStats(d);
      const btn = document.createElement('button');
      btn.dataset.d = d;
      if (d === duration) btn.classList.add('active');
      btn.innerHTML = `<span>${d}秒</span><span class="d-best">${ds.plays ? ds.bestCps.toFixed(1) + ' CPS' : '-'}</span>`;
      btn.addEventListener('click', () => {
        if (running) return;
        duration = d;
        renderDurationButtons();
        timeLeftEl.textContent = duration.toFixed(1);
        renderStats();
      });
      durationSelect.appendChild(btn);
    });
  }

  function renderStats() {
    const ds = getDurStats(duration);
    document.getElementById('statCountLabel').textContent = duration + '秒游玩次数';
    document.getElementById('statCount').textContent = ds.plays;
    document.getElementById('statBest').textContent = ds.plays ? ds.bestCps.toFixed(1) : '-';
    document.getElementById('statBestClicks').textContent = ds.plays ? ds.bestClicks : '-';
  }

  function gradeFor(cps) {
    return GRADES.find(g => cps >= g.min) || GRADES[GRADES.length - 1];
  }

  function starsFor(cps) {
    if (cps >= 10) return 5;
    if (cps >= 8) return 4;
    if (cps >= 6) return 3;
    if (cps >= 4) return 2;
    return 1;
  }

  function spawnRipple(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    clickPad.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }

  function tick() {
    if (!running) return;
    const elapsed = (performance.now() - startTime) / 1000;
    const left = Math.max(0, duration - elapsed);
    timeLeftEl.textContent = left.toFixed(1);
    const liveCps = elapsed > 0 ? clicks / elapsed : 0;
    clickCountLine.textContent = `点击数: ${clicks} · 实时CPS: ${liveCps.toFixed(1)}`;
    if (elapsed > 0.03) samples.push({ t: Math.min(elapsed, duration), cps: liveCps });
    drawGraph();
    if (left <= 0) {
      finish();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    finished = false;
    clicks = 1;
    samples = [];
    startTime = performance.now();
    resizeGraph();
    clickCountLine.textContent = '点击数: 1 · 实时CPS: 0.0';
    resultPanel.classList.remove('show');
    clickPad.textContent = '点击!点击!点击!';
    rafId = requestAnimationFrame(tick);
  }

  function renderGradeTable(cps) {
    const grade = gradeFor(cps);
    const table = document.getElementById('gradeTable');
    table.innerHTML = '<tr><th>等级</th><th>基准CPS</th></tr>' +
      GRADES.map(g => `<tr class="${g.key === grade.key ? 'current-row' : ''}"><td>${g.label}</td><td>${g.min}+</td></tr>`).join('');
  }

  function finish() {
    running = false;
    finished = true;
    cancelAnimationFrame(rafId);
    timeLeftEl.textContent = '0.0';
    clickPad.textContent = '按下方按钮重新开始';

    const cps = clicks / duration;
    const ds = getDurStats(duration);
    ds.plays += 1;
    if (cps > ds.bestCps) ds.bestCps = cps;
    if (clicks > ds.bestClicks) ds.bestClicks = clicks;
    allStats[duration] = ds;
    saveStats(STORE_KEY, allStats);
    renderStats();
    renderDurationButtons();

    const grade = gradeFor(cps);
    const stars = starsFor(cps);
    document.getElementById('resultTitle').textContent = cps.toFixed(1) + ' CPS';
    document.getElementById('resultStars').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
    document.getElementById('resultDesc').textContent = `共点击 ${clicks}次 / ${duration}秒 — ${grade.label}`;
    renderGradeTable(cps);
    resultPanel.classList.add('show');
    resultPanel.dataset.share = `我在CPS测试中获得了${cps.toFixed(1)} CPS(${clicks}次点击/${duration}秒,${grade.key}等级)!你也来试试 → `;

    const lbList = addToLeaderboard(LB_KEY, { value: cps, duration, date: Date.now() }, false);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">${entry.value.toFixed(1)} CPS</span><span class="lb-detail">${entry.duration}秒 · ${dateStr}</span>`;
    }, '还没有记录。快来挑战第一次吧!');
  }

  clickPad.addEventListener('click', (e) => {
    if (finished) return;
    const rect = clickPad.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);
    if (!running) {
      start();
      return;
    }
    clicks += 1;
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    finished = false;
    samples = [];
    resultPanel.classList.remove('show');
    clickPad.textContent = 'START';
    timeLeftEl.textContent = duration.toFixed(1);
    clickCountLine.textContent = '点击数: 0 · 实时CPS: 0.0';
    graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href.replace('games/cps.html', ''));
  });

  window.addEventListener('resize', () => { if (running) resizeGraph(); });

  renderDurationButtons();
  renderStats();
  resizeGraph();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
</html>
