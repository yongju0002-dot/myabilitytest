<body>
  <div class="wrap">
    <a class="back-link" href="/ko/">← 메인으로</a>
    <div class="lang-switch">
      <a class="active" href="/ko/tests/time-stop">한국어</a>
      <a href="/en/tests/time-stop">English</a>
      <a href="/ja/tests/time-stop">日本語</a>
      <a href="/zh/tests/time-stop">中文</a>
    </div>
    <h1>⏱️ 시간 정지 게임</h1>
    <p class="sub">시계를 보지 않고, 목표 시간이 되었다고 생각하는 순간 눌러보세요!</p>

    <div id="setupScreen">
      <div class="level-card" style="text-align:left;">
        <div class="label" style="text-align:center; margin-bottom:10px;">참가 인원</div>
        <div class="duration-select" id="playerSelect">
          <button data-v="1" class="active">1인</button>
          <button data-v="2">2인</button>
          <button data-v="3">3인</button>
          <button data-v="4">4인</button>
          <button data-v="6">6인</button>
          <button data-v="8">8인</button>
        </div>
        <div class="label" style="text-align:center; margin:16px 0 10px;">목표 시간</div>
        <div class="duration-select" id="targetSelect">
          <button data-v="5">5초</button>
          <button data-v="10" class="active">10초</button>
          <button data-v="15">15초</button>
          <button data-v="20">20초</button>
          <button data-v="30">30초</button>
        </div>
        <div class="setup-toggle">
          <label><input type="checkbox" id="blindToggle" checked> 결과 가리기 (모두 끝난 뒤 한번에 공개)</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="startGameBtn">게임 시작</button>
      </div>
    </div>

    <div id="playScreen" style="display:none;">
      <div class="player-badge">
        <div class="who">참가자</div>
        <div class="num" id="playerNum">1</div>
        <div class="who" id="playerSub">/ 1 · 목표 10초</div>
      </div>

      <div class="timer-orb" id="timerOrb">시작</div>

      <div id="turnResult" class="result-panel">
        <div class="emoji">⏱️</div>
        <h2 id="turnTitle"></h2>
        <div class="desc" id="turnDesc"></div>
        <div class="btn-row">
          <button class="btn" id="nextPlayerBtn">다음 참가자</button>
        </div>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">🏆</div>
      <h2>최종 결과</h2>
      <ul class="leaderboard" id="leaderboard"></ul>
      <div class="btn-row">
        <button class="btn" id="retryBtn">다시 하기</button>
        <button class="btn share" id="shareBtn">결과 공유하기</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">도전 횟수</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">최소 오차</div>
        <div class="value" id="statBest">-</div>
      </div>
      <div class="stat-box">
        <div class="label">평균 오차</div>
        <div class="value" id="statAvg">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 역대 기록 순위 (최대 30위)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillTimeStopStats';
  const LB_KEY = 'skillTimeStopLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: null, sum: 0 });

  const playerSelect = document.getElementById('playerSelect');
  const targetSelect = document.getElementById('targetSelect');
  const blindToggle = document.getElementById('blindToggle');
  const setupScreen = document.getElementById('setupScreen');
  const playScreen = document.getElementById('playScreen');
  const timerOrb = document.getElementById('timerOrb');
  const turnResult = document.getElementById('turnResult');
  const resultPanel = document.getElementById('resultPanel');

  let playerCount = 1;
  let targetTime = 10;
  let blind = true;
  let currentPlayer = 0;
  let running = false;
  let turnDone = false;
  let startTime = 0;
  let results = [];

  function selectButtons(container, onPick) {
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        onPick(parseFloat(btn.dataset.v));
      });
    });
  }
  selectButtons(playerSelect, v => playerCount = v);
  selectButtons(targetSelect, v => targetTime = v);

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best !== null ? stats.best.toFixed(2) + '초' : '-';
    document.getElementById('statAvg').textContent = stats.count ? (stats.sum / stats.count).toFixed(2) + '초' : '-';
  }

  function startGame() {
    blind = blindToggle.checked;
    currentPlayer = 0;
    results = [];
    setupScreen.style.display = 'none';
    resultPanel.classList.remove('show');
    playScreen.style.display = '';
    startTurn();
  }

  function startTurn() {
    running = false;
    turnDone = false;
    timerOrb.classList.remove('running', 'disabled');
    timerOrb.textContent = '시작';
    document.getElementById('playerNum').textContent = currentPlayer + 1;
    document.getElementById('playerSub').textContent = `/ ${playerCount} · 목표 ${targetTime}초`;
    turnResult.classList.remove('show');
  }

  timerOrb.addEventListener('click', () => {
    if (turnDone) return;
    if (!running) {
      running = true;
      startTime = performance.now();
      timerOrb.classList.add('running');
      timerOrb.textContent = '정지!';
      playStartSound();
      return;
    }
    running = false;
    turnDone = true;
    timerOrb.classList.remove('running');
    timerOrb.classList.add('disabled');
    playEndSound();
    const elapsed = (performance.now() - startTime) / 1000;
    const diff = Math.abs(elapsed - targetTime);
    results.push({ player: currentPlayer + 1, elapsed, diff });

    document.getElementById('turnTitle').textContent = blind ? '기록 완료!' : elapsed.toFixed(2) + '초';
    document.getElementById('turnDesc').textContent = blind
      ? '결과는 모든 참가자가 끝난 뒤 공개됩니다.'
      : `목표 ${targetTime}초 — 오차 ${diff.toFixed(2)}초`;
    turnResult.classList.add('show');
  });

  document.getElementById('nextPlayerBtn').addEventListener('click', () => {
    currentPlayer += 1;
    if (currentPlayer >= playerCount) {
      finishGame();
    } else {
      startTurn();
    }
  });

  function finishGame() {
    playScreen.style.display = 'none';
    const sorted = [...results].sort((a, b) => a.diff - b.diff);

    const best = sorted[0];
    stats.count += 1;
    if (stats.best === null || best.diff < stats.best) stats.best = best.diff;
    stats.sum += best.diff;
    saveStats(STORE_KEY, stats);
    renderStats();

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((r, i) => {
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
      return `<li class="${i === 0 ? 'winner' : ''}">
        <span class="rank">${medal}</span>
        <span class="lb-name">참가자 ${r.player}</span>
        <span class="lb-detail">${r.elapsed.toFixed(2)}초 (오차 ${r.diff.toFixed(2)}초)</span>
      </li>`;
    }).join('');

    resultPanel.classList.add('show');
    resultPanel.dataset.share = playerCount === 1
      ? `시간 정지 게임에서 목표 ${targetTime}초 중 오차 ${best.diff.toFixed(2)}초! 너도 해봐 → `
      : `시간 정지 게임에서 참가자 ${best.player}이(가) 오차 ${best.diff.toFixed(2)}초로 우승! 너도 해봐 → `;

    const lbList = addToLeaderboard(LB_KEY, { value: best.diff, targetTime, playerCount, date: Date.now() }, true);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">오차 ${entry.value.toFixed(2)}초</span><span class="lb-detail">목표 ${entry.targetTime}초 · ${entry.playerCount}인 · ${dateStr}</span>`;
    }, '아직 기록이 없어요. 첫 도전을 해보세요!');
  }

  document.getElementById('startGameBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', () => {
    resultPanel.classList.remove('show');
    setupScreen.style.display = '';
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href);
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
