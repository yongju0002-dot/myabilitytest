<body>
  <div class="wrap">
    <a class="back-link" href="/ko/">← 메인으로</a>

    <h1>🧠 순간 기억력 테스트</h1>
    <p class="sub">초록색으로 표시된 칸의 위치를 기억한 뒤, 같은 칸을 클릭하세요.</p>

      <div class="label">현재 레벨</div>
      <div class="num" id="levelNum">1</div>
      <div class="sub" id="tilesSub">기억할 칸: 3개</div>
    </div>

    <div class="memory-grid" id="memoryGrid"></div>

    <div class="btn-row" id="startRow">
      <button class="btn" id="startBtn">시작하기</button>
    </div>

    <div id="resultPanel" class="result-panel">
      <div class="emoji">💥</div>
      <h2 id="resultTitle"></h2>
      <div class="stars" id="resultStars"></div>
      <div class="desc" id="resultDesc"></div>
      <div class="percentile" id="resultPercentile"></div>
      <table class="grade-table" id="gradeTable"></table>
      <div class="btn-row">
        <button class="btn" id="retryBtn">다시 도전</button>
        <button class="btn share" id="shareBtn">결과 공유하기</button>
      </div>
        <div class="other-tests">
          <div class="label">다른 능력 테스트도 해보세요</div>

            <a href="/ko/tests/chimp-test">🐵 침팬지 테스트</a>
            <a href="/ko/tests/reaction-time">⚡ 반응 속도</a>
            <a href="/ko/tests/dynamic-vision">👁️ 동체시력</a>
            <a href="/ko/tests/click-speed">🖱️ CPS 클릭 속도</a>
          </div>
        </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="label">도전 횟수</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">최고 레벨</div>
        <div class="value" id="statBest">0</div>
      </div>
      <div class="stat-box">
        <div class="label">최고 기억 칸수</div>
        <div class="value" id="statBestTiles">-</div>
      </div>
    </div>

    <h2 style="text-align:center; font-size:16px; margin-top:28px;">🏆 역대 기록 순위 (최대 30위)</h2>
    <div id="topLeaderboard"></div>
  </div>

<script src="/skill-test/common.js"></script>
<script>
  const STORE_KEY = 'skillMemoryStats';
  const LB_KEY = 'skillMemoryLeaderboardV1';
  let stats = loadStats(STORE_KEY, { count: 0, best: 0 });
  const grid = document.getElementById('memoryGrid');
  const resultPanel = document.getElementById('resultPanel');
  const startRow = document.getElementById('startRow');

  let level = 1;
  let over = false;
  let gridSize = 3;
  let targets = new Set();
  let remaining = new Set();
  let locked = true;

  function tilesFor(lv) { return lv + 2; }

  function gridSizeFor(tiles) {
    if (tiles <= 4) return 3;
    if (tiles <= 7) return 4;
    if (tiles <= 11) return 5;
    if (tiles <= 16) return 6;
    return 7;
  }

  function renderStats() {
    document.getElementById('statCount').textContent = stats.count;
    document.getElementById('statBest').textContent = stats.best;
    document.getElementById('statBestTiles').textContent = stats.best ? tilesFor(stats.best) + '개' : '-';
  }

  function rankText(lv) {
    if (lv >= 20) return `${lv}레벨! 천재적인 기억력이에요. 상위 1%!`;
    if (lv >= 16) return `${lv}레벨! 뛰어난 기억력이에요. 상위 3%!`;
    if (lv >= 13) return `${lv}레벨! 훌륭한 기억력이에요. 상위 10%!`;
    if (lv >= 9) return `${lv}레벨! 좋은 기억력이에요. 상위 20%.`;
    if (lv >= 5) return `${lv}레벨, 평범한 기억력이에요.`;
    return `${lv}레벨. 다시 도전해보세요!`;
  }

  const GRADES = [
    { key: 'SS', min: 20, label: 'SS · 천재적' },
    { key: 'S', min: 16, label: 'S · 뛰어남' },
    { key: 'A', min: 13, label: 'A · 훌륭함' },
    { key: 'B', min: 9, label: 'B · 좋음' },
    { key: 'C', min: 5, label: 'C · 평범' },
    { key: 'D', min: 2, label: 'D · 아쉬움' },
    { key: 'F', min: 0, label: 'F · 초반 탈락' },
  ];

  function gradeFor(lv) {
    return GRADES.find(g => lv >= g.min) || GRADES[GRADES.length - 1];
  }

  function starsFor(lv) {
    if (lv >= 16) return 5;
    if (lv >= 13) return 4;
    if (lv >= 9) return 3;
    if (lv >= 5) return 2;
    return 1;
  }

  function renderGradeTable(lv) {
    const grade = gradeFor(lv);
    const table = document.getElementById('gradeTable');
    table.innerHTML = '<tr><th>등급</th><th>기준 레벨</th></tr>' +
      GRADES.map(g => `<tr class="${g.key === grade.key ? 'current-row' : ''}"><td>${g.label}</td><td>${g.min}+</td></tr>`).join('');
  }

  function buildGrid() {
    const tiles = tilesFor(level);
    gridSize = gridSizeFor(tiles);
    const total = gridSize * gridSize;
    grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    grid.innerHTML = '';

    targets = new Set();
    while (targets.size < tiles) targets.add(Math.floor(Math.random() * total));
    remaining = new Set(targets);

    document.getElementById('levelNum').textContent = level;
    document.getElementById('tilesSub').textContent = `기억할 칸: ${tiles}개 (${gridSize}x${gridSize})`;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'memory-cell';
      cell.dataset.i = i;
      cell.addEventListener('click', () => pick(i, cell));
      grid.appendChild(cell);
    }
  }

  function showTargets() {
    locked = true;
    targets.forEach(i => grid.children[i].classList.add('show-target'));
    const showTime = 800 + gridSize * 150;
    setTimeout(() => {
      targets.forEach(i => grid.children[i].classList.remove('show-target'));
      locked = false;
    }, showTime);
  }

  function pick(i, cell) {
    if (locked || over || cell.classList.contains('disabled')) return;

    if (targets.has(i)) {
      cell.classList.add('disabled', 'picked-correct');
      remaining.delete(i);
      if (remaining.size === 0) {
        locked = true;
        setTimeout(() => { level += 1; buildGrid(); showTargets(); }, 600);
      }
    } else {
      cell.classList.add('disabled', 'picked-wrong');
      locked = true;
      targets.forEach(idx => grid.children[idx].classList.add('show-target'));
      [...grid.children].forEach(c => c.classList.add('disabled'));
      setTimeout(() => endGame(), 700);
    }
  }

  function endGame() {
    over = true;
    const reached = level;
    stats.count += 1;
    if (reached > stats.best) stats.best = reached;
    saveStats(STORE_KEY, stats);
    renderStats();

    const grade = gradeFor(reached);
    const stars = starsFor(reached);
    document.getElementById('resultTitle').textContent = reached + '레벨에서 실패!';
    document.getElementById('resultStars').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
    document.getElementById('resultDesc').textContent = tilesFor(reached) + '개의 칸을 기억해야 했어요.';
    document.getElementById('resultPercentile').textContent = rankText(reached);
    renderGradeTable(reached);
    resultPanel.classList.add('show');
    resultPanel.dataset.share = `순간 기억력 테스트에서 ${reached}레벨 달성! (${grade.key}등급) 너도 해봐 → `;

    const lbList = addToLeaderboard(LB_KEY, { value: reached, date: Date.now() }, false);
    renderTopLeaderboard(lbList);
  }

  function renderTopLeaderboard(list) {
    renderLeaderboard('topLeaderboard', list, (entry) => {
      const d = new Date(entry.date);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      return `<span class="lb-name">${entry.value}레벨</span><span class="lb-detail">${dateStr}</span>`;
    }, '아직 기록이 없어요. 첫 도전을 해보세요!');
  }

  function reset() {
    level = 1;
    over = false;
    resultPanel.classList.remove('show');
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startRow.style.display = 'none';
    buildGrid();
    showTargets();
  });
  document.getElementById('retryBtn').addEventListener('click', reset);
  document.getElementById('shareBtn').addEventListener('click', () => {
    shareResult((resultPanel.dataset.share || '') + location.href);
  });

  renderStats();
  renderTopLeaderboard(loadStats(LB_KEY, []));
</script>
</body>
